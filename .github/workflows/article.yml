name: Write weekly briefing

# Every Monday: assembles a dated briefing from the figures already on the dashboard —
# debt, prices, the cedi, trade, the budget and the week ahead — and publishes it
# in the Articles portal. Nothing is invented; every sentence is built from the data files.
on:
  schedule:
    - cron: "30 6 * * 1"   # Mondays, 06:30 GMT
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Its own concurrency group. A shared one meant this run sat pending behind the
# five-minute news job and was cancelled by the next pending run before it ever
# started; each job now queues only against itself. Simultaneous commits are safe
# because every job rebases on origin before it pushes.
concurrency:
  group: article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the briefing
        run: node scripts/write-article.mjs
      - name: Commit it
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles articles-data.js
          if git diff --cached --quiet; then
            echo "No new article."
            exit 0
          fi
          git commit -m "Weekly briefing $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Ask GitHub Pages to rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will rebuild on its own schedule."
