name: Watch official releases

# Every day: checks Bank of Ghana, Ghana Statistical Service, Ministry of Finance, PURC and NPA pages
# for new publications and opens an issue listing what changed and which figures to update.
# It never changes the website by itself.
on:
  schedule:
    - cron: "0 9 * * 1-5"   # 09:00 GMT, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Its own concurrency group. A shared one meant this run sat pending behind the
# five-minute news job and was cancelled by the next pending run before it ever
# started; each job now queues only against itself. Simultaneous commits are safe
# because every job rebases on origin before it pushes.
concurrency:
  group: watch-releases
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF reader
        run: npm install --no-save --no-package-lock pdf-parse@1.1.1
      - name: Check sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watch-releases.mjs
      - name: Save what has been seen
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data-watch/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release watcher: update seen links"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
