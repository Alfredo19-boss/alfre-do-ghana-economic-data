name: Update long history

# Every morning: Ghana's annual series back to 1993 from the World Bank's open data API.
# Feeds the "Since 1993" chart behind every figure. Writes history-data.js and commits it.
# The sources publish annually, so most mornings there is nothing new and nothing is committed.
on:
  schedule:
    - cron: "40 6 * * *"   # 06:40 GMT, every day (Ghana runs on GMT, so 6:40 a.m. in Accra)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

# Its own concurrency group. A shared one meant this run sat pending behind the
# five-minute news job and was cancelled by the next pending run before it ever
# started; each job now queues only against itself. Simultaneous commits are safe
# because every job rebases on origin before it pushes.
concurrency:
  group: history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the annual series
        run: node scripts/fetch-history.mjs
      - name: Fetch African inflation
        run: node scripts/fetch-africa.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history-data.js africa-data.js
          if git diff --cached --quiet -- history-data.js africa-data.js; then
            echo "No changes to commit."
            exit 0
          fi
          if [ "$(git diff --cached --numstat | awk '{s+=$1} END {print s}')" = "2" ] && git diff --cached | grep -q '"updated"'; then
            echo "Only the timestamp changed; nothing to publish."
            git reset
            exit 0
          fi
          git commit -m "Annual history update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Ask GitHub Pages to rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will rebuild on its own schedule."
