name: Update business news

# Every five minutes: collects Ghana business headlines from publishers' RSS feeds into
# news-data.js and the day's front pages into papers-data.js. Commits only when there are new
# stories, so a quiet run changes nothing. Five minutes is GitHub's fastest schedule, and its
# scheduler is best-effort: a run can arrive late or be skipped when GitHub is busy.
on:
  schedule:
    - cron: "*/5 * * * *"   # every five minutes
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Its own concurrency group. All the data jobs used to share one, and because this job runs
# most often it kept the lane busy — the slower jobs sat pending and were cancelled by the
# next pending run before they ever started. Each job now queues only against itself.
# Simultaneous commits are safe because every job rebases on origin before it pushes.
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines
        run: node scripts/fetch-news.mjs
      - name: Fetch today's front pages
        run: node scripts/fetch-papers.mjs || echo "Papers job failed; keeping the previous front pages."
      - name: Commit if there are new stories
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ignore changes that only touch the "updated" time or log lines
          if git diff --quiet -I '"updated":' -I '^    "' -- news-data.js; then
            git checkout -- news-data.js
            echo "No new stories."
            exit 0
          fi
          git add news-data.js papers-data.js
          git commit -m "News headlines $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Ask GitHub Pages to rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will rebuild on its own schedule."
