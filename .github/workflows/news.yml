name: Update business news

# Hourly: collects Ghana business headlines from publishers' RSS feeds into news-data.js,
# including embedded world/African wire lists, and updates papers-data.js. Commits only
# when story lists change, so a quiet run changes nothing.
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect headlines
        run: node scripts/fetch-news.mjs
      - name: Fetch today's front pages
        run: node scripts/fetch-papers.mjs || echo "Papers job failed; keeping the previous front pages."
      - name: Commit if there are new stories
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ignore changes that only touch the "updated" time or log lines; a run counts as
          # worth committing if either news-data.js or papers-data.js gained stories.
          if git diff --quiet -I '"updated":' -I '^    "' -- news-data.js papers-data.js; then
            git checkout -- news-data.js papers-data.js
            echo "No new stories."
            exit 0
          fi
          git add news-data.js papers-data.js
          git commit -m "News headlines $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Ask GitHub Pages to rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will rebuild on its own schedule."
