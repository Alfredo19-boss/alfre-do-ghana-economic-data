name: Update live rates

# Cedi quotes, world markets, the GSE, business news and front pages, refreshed every
# 5 minutes; the Bank of Ghana rates, gold and cocoa (once the job in market-data.yml)
# every 30 minutes.
#
# GitHub only starts scheduled jobs when it has spare capacity, so a plain "every 5 minutes"
# schedule often runs every 30 to 90 minutes. This job is started once an hour (and by the
# "Run workflow" button) and then refreshes the data itself every 5 minutes for almost six
# hours. When the next start arrives it takes over from the running one, so there is no gap.
# It saves only when something actually moved. Public repositories do not pay for these minutes.
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: live-rates
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh every 5 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 350*60 ))
          round=0
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            node scripts/fetch-live-fx.mjs || echo "No quote this round; the last one stands."
            node scripts/fetch-markets.mjs || echo "No market prices this round; the last set stands."
            node scripts/fetch-news.mjs || echo "No headlines this round."
            node scripts/fetch-papers.mjs || echo "No front pages this round."
            if [ $(( round % 6 )) -eq 0 ]; then
              node scripts/fetch-market-data.mjs || echo "Bank of Ghana rates skipped this round."
              node scripts/refresh-readings.mjs || echo "Reading check skipped this round."
            fi
            # headlines count as new only if a story was added, not just the time stamp
            if git diff --quiet -I '"updated":' -I '^    "' -- news-data.js world-data.js papers-data.js; then
              git checkout -- news-data.js world-data.js papers-data.js
            fi
            git add live-data.js markets-data.js news-data.js world-data.js papers-data.js auto-data.js data.js
            if git diff --cached --quiet; then
              echo "$(date -u +%H:%M) nothing moved"
            else
              git commit -q -m "Live data $(date -u +'%Y-%m-%d %H:%M') GMT"
              for try in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q && break; sleep 8; done
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
              echo "$(date -u +%H:%M) saved"
            fi
            round=$((round+1))
            sleep $(( 300 - ( $(date +%s) - start ) % 300 ))
          done
