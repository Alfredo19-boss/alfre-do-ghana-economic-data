name: Update live rates

# Every 20 minutes: a market quote for the cedi (and gold) written to live-data.js, plus world
# indices, commodities, crypto, currencies and every Ghana Stock Exchange listing written to
# markets-data.js. The Bank of Ghana's official interbank rate is a separate, once-a-morning
# job (market-data.yml); this one does not touch it.
#
# The job commits only when a quote has actually moved, so a flat market costs nothing and
# GitHub Pages is not rebuilt for no reason.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch market quotes
        run: node scripts/fetch-live-fx.mjs || echo "No quote this run; the last one stands."
      - name: Fetch world markets and the GSE
        run: node scripts/fetch-markets.mjs || echo "No market prices this run; the last set stands."
      - name: Commit if a rate moved
        run: |
          git config user.name "alfredo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.js markets-data.js
          if git diff --cached --quiet -- live-data.js markets-data.js; then
            echo "Nothing moved."
            exit 0
          fi
          git commit -m "Live rates $(date -u +'%Y-%m-%d %H:%M') GMT"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Ask GitHub Pages to rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages will rebuild on its own schedule."
